name: Scorecard

# OpenSSF Scorecard (https://scorecard.dev): scores this repository's
# security practices (branch protection, pinned dependencies, token
# permissions, dangerous workflows, signed releases, ...). Results go to the
# repository's code scanning alerts (Security tab) and to the Scorecard API,
# which serves the README badge.
#
# Scorecard's `publish_results` only accepts a workflow whose jobs have no
# other steps and read-only defaults: keep this file to these steps.

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Upload the SARIF to code scanning.
      security-events: write
      # Publish the results to the Scorecard API (the badge).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif

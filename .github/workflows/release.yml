name: release

# Publishes `grist-widget-sdk` and `create-grist-widget` to npm via Trusted
# Publishing (OIDC) -- no stored NPM_TOKEN. npm Trusted Publishing trust is
# scoped to an exact `repo + workflow file` pair (npm's UI allows ONE trusted
# workflow file per package), so everything that publishes lives in this file.
#
# ── Three jobs, on every push to main ─────────────────────────────────────
#   plan        Reads what the push asks for (scripts/release/release-plan.mjs):
#               pending changesets, and published packages whose version
#               isn't on npm yet. Read-only.
#   version-pr  Changesets pending: opens or updates the "Version Packages"
#               pull request. No environment, so no approval: it never waits.
#   publish     A version not on npm yet, i.e. the Version Packages pull
#               request just merged: `changeset publish` over OIDC (tag:
#               latest), git tags and GitHub Releases. Only this job uses the
#               `npm` environment, so a release takes one approval, and a
#               push with nothing to publish leaves no run waiting for one
#               (plan to 0.8.0, M1; a waiting run used to block every later
#               one, the Version Packages pull request included).
#
#   One-time npm setup (see docs/operations/releasing.md): after 0.2.0 was claimed manually,
#   add a Trusted Publisher for the package pointing at repo + this file.
#
# Runs on pushes to `main` only, and grants permissions per job (none at
# workflow level). A `publish-staging` job used to publish an `-rc.N` SDK,
# tagged `next`, from any other branch; it was the only path that could
# publish from a branch other than `main`, and was retired on 2026-11-01
# (docs/history/2026-11-01-widget-lifecycle-plan.md, U2 / D1).
# docs/operations/releasing.md describes how to test an unreleased SDK without publishing.

on:
  push:
    branches: [main]

# Nothing at workflow level: each job states what it needs (principle 5 of
# docs/history/2026-11-01-widget-lifecycle-plan.md).
permissions: {}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_pr: ${{ steps.plan.outputs.version_pr }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: plan
        name: What this push asks for
        run: node scripts/release/release-plan.mjs

  version-pr:
    needs: plan
    if: needs.plan.outputs.version_pr == 'true'
    runs-on: ubuntu-latest
    # A newer push to main supersedes this one's Version Packages update.
    concurrency:
      group: release-version-pr
      cancel-in-progress: true
    permissions:
      contents: write        # commit the Version Packages branch
      pull-requests: write   # open/update the "Version Packages" PR
    steps:
      # No credentials left in .git/config: changesets/action pushes the
      # Version Packages commit through the GitHub API with its
      # `github-token` input (push-with-git-cli: false), not with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install deps
        run: pnpm install --frozen-lockfile
      # The plan runs this job only with changesets pending, so the action
      # versions and never publishes. publish-script only shapes the PR's
      # body (which otherwise tells the reader to publish by hand). The token
      # falls back to GITHUB_TOKEN without CHANGESET_PUSH_TOKEN (see the
      # publish job's notes), and the Version Packages PR's CI then waits
      # for a re-run.
      - name: Version Packages pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          github-token: ${{ secrets.CHANGESET_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # One publish at a time, never cancelled half-way.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    # npm's trusted publishers for both packages name this environment, and
    # the environment only accepts `main` (docs/operations/releasing.md, one-time setup). A
    # branch carrying a modified copy of this workflow, pushed by anyone with
    # write access (an agent included), can then never mint a token npm
    # accepts. Its required reviewer is the maintainer (docs/operations/releasing.md,
    # one-time setup): one approval per release.
    environment: npm
    permissions:
      contents: write        # push tags, create releases
      id-token: write        # OIDC Trusted Publishing
      # `workflows` is NOT a valid key here -- it's a GitHub Apps
      # installation-level permission, not one of the fixed set of scopes the
      # GITHUB_TOKEN's `permissions:` block accepts (actions, checks, contents,
      # deployments, id-token, issues, packages, pages, pull-requests,
      # security-events, statuses, ...). Adding it doesn't grant anything --
      # it makes the whole workflow file invalid, failing every run at
      # parse time with zero jobs scheduled, found live: worse than the
      # problem it was meant to fix, since that took down npm publishing too,
      # not just the git tag push. Reverted.
      #
      # The actual, narrower problem this can't fix: the default GITHUB_TOKEN
      # can never create or update a ref (branch or tag) whose history
      # introduces .github/workflows/*.yml changes, and there is no
      # `permissions:` setting that lifts this for GITHUB_TOKEN specifically --
      # found live, create-grist-widget@0.3.2's git tag push after a release
      # that happened to land near deploy-apps.yml's introduction. npm
      # publishing itself is unaffected either way (OIDC Trusted Publishing
      # doesn't go through this token). The fix is a credential other than
      # GITHUB_TOKEN: changesets/action v2 pushes the Version Packages commit
      # and the release tags through the GitHub API with its `github-token`
      # input, which this job's "Version PR or publish" step sets to CHANGESET_PUSH_TOKEN when
      # that secret exists -- a fine-grained PAT with
      # Contents, Pull requests and Workflows read/write on this repo only (see
      # docs/operations/releasing.md). It also makes the Version Packages PR's own CI start on
      # its own: anything pushed with GITHUB_TOKEN gets its runs parked as
      # "action_required" (found live on 0.3.16's Version Packages PR, whose
      # CI needed a manual re-run). Without the secret, both fall back to
      # GITHUB_TOKEN, i.e. the previous behavior.
    steps:
      # No credentials left in .git/config: changesets/action pushes the
      # Version Packages commit and the tags through the GitHub API with its
      # `github-token` input (push-with-git-cli: false), not with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Trusted Publishing (OIDC) needs npm >= 11.5, which Node 24 bundles
      # (Node 22's is older). Taking it from Node rather than `npm install -g`
      # keeps npm itself out of an ad-hoc, unlocked install; the check below
      # fails the release before publishing if a Node 24 ever ships an older
      # npm, or npm 12 (whose `npm info --json` output @changesets/cli once
      # misread).
      - name: npm supports Trusted Publishing
        run: |
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number)
            if (major !== 11 || minor < 5) {
              console.error(`npm ${process.argv[1]}: Trusted Publishing needs npm 11.5 or later on the 11 line`)
              process.exit(1)
            }
            console.log(`npm ${process.argv[1]}`)
          ' "$(npm --version)"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build the SDK (published artifact)
        run: pnpm --filter grist-widget-sdk build

      # changesets/action v2 (requires @changesets/cli 3): inputs are
      # kebab-case and renamed from v1 (version/publish/commit/title), the
      # token is read ONLY from `github-token` (the GITHUB_TOKEN env var is
      # ignored), and commits + tags go through the GitHub API by default
      # (push-with-git-cli: false), so no `git push` -- and no pre-push hook
      # -- is involved. Published packages are detected via the
      # CHANGESETS_OUTPUT file the action exports, which `pnpm run release`
      # -> `changeset publish` inherits.
      # The plan job runs this only when a version isn't on npm, so there are
      # no changesets here and the action publishes.
      - name: Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          github-token: ${{ secrets.CHANGESET_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
